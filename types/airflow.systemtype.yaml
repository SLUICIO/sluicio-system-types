# Sluicio system type — import via System types → Import, or share it.
format: sluicio/system-type/v1
key: airflow
label: Apache Airflow
is_system: false
detect_prefixes:
    - airflow.dagrun.
    - airflow.executor.
    - airflow.pool.
    - airflow.scheduler
checks:
    - name: DAG task failures
      description: Task instances failed, split by DAG so the firing names which one. This is the per-DAG failure signal; bind it to an integration per DAG to alert on one flow alone.
      metric: airflow.ti_failures
      agg: increase
      op: gt
      split_by: dag_id
      severity: warning
      unit: tasks
      display: true
    - name: Operator failures
      description: Failures counted per operator as well as per DAG - the same events as above seen by the kind of task that raised them, which is what tells a flaky sensor from a broken load step.
      metric: airflow.operator_failures
      agg: increase
      op: gt
      split_by: dag_id
      severity: warning
      unit: tasks
    - name: Scheduler not running
      description: The scheduler heartbeat stopped. Fires on the ABSENCE of the metric, because a scheduler that dies emits nothing left to threshold - which is why nothing else here would notice. Every DAG is stopped while this holds.
      metric: airflow.scheduler_heartbeat
      agg: increase
      op: lt
      threshold: 1
      fire_on_no_data: true
      severity: critical
      display: true
    - name: Tasks starving for a pool slot
      description: 'Tasks are runnable but have no slot, so they wait without failing - a queue nobody is told about. Left unsplit on purpose: it affects every DAG drawing on that pool, and splitting by pool_name would stop it saying so.'
      metric: airflow.pool.starving_tasks
      agg: max
      op: gt
      severity: warning
      unit: tasks
      display: true
    - name: Executor out of slots
      description: No open executor slots, so nothing new starts however much is queued. Raise the threshold above zero to fire before saturation rather than at it.
      metric: airflow.executor.open_slots
      agg: min
      op: lt
      threshold: 1
      severity: warning
      unit: slots
      display: true
    - name: Tasks queued and not starting
      description: The queue is deep. Normal during a burst, and a stuck executor otherwise - tune to what your executor clears in five minutes.
      metric: airflow.executor.queued_tasks
      agg: max
      op: gt
      threshold: 50
      severity: warning
      unit: tasks
